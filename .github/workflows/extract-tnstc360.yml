name: Extract TNSTC 360 source
on:
  push:
    paths:
      - ".github/workflows/extract-tnstc360.yml"
      - ".github/extract-tnstc360-trigger.txt"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website source
        run: |
          mkdir -p tnstc360-website
          unzip -o "tnstc360-source (1).zip" -d tnstc360-website
          test -f tnstc360-website/package.json
          test -f tnstc360-website/src/App.tsx
          test -f tnstc360-website/public/assets/tnstc-bus.glb
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tnstc360-website
          git commit -m "Extract TNSTC 360 website source" || echo "No changes to commit"
          git push
